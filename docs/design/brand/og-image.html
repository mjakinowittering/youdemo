<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <title>YouDemo · Open Graph image</title>
        <meta name="viewport" content="width=1200" />
        <style>
            @font-face {
                font-family: Figtree;
                src: url(fonts/figtree-latin-wght-normal.woff2) format('woff2');
                font-weight: 300 900;
                font-display: block;
            }
            html,
            body {
                margin: 0;
            }
            /* YouDemo V2: light-only tokens and components, in Matthew Akino-Wittering's design language. */

            .yd2 {
                --base: #f8f5ef;
                --sand: #f7f0e3;
                --card: #fdfbf7;
                --ink: #17151f;
                --muted: #46434f;
                --rule: #e7e3dc;
                --hairline: #d9d6e0;
                --accent: #f07a2e;
                --accent-tint: #fde3cf;
                --danger: #b42318;
                --danger-tint: #fbe4e1;
                --success-tint: #d8ecd5;
                --rec: #e5484d;
                --scrim: rgba(23, 21, 31, 0.45);
                --font-sans: Figtree, ui-sans-serif, system-ui, sans-serif;
                --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                --shadow-offset: 0 4px 0 #17151f;
                --shadow-offset-sm: 0 3px 0 #17151f;
                --shadow-offset-press: 0 2px 0 #17151f;
                --shadow-panel: 8px 8px 0 #17151f;
            }
            .yd2,
            .yd2 * {
                box-sizing: border-box;
            }
            .yd2 {
                font-family: var(--font-sans);
                font-size: 16px;
                line-height: 1.5;
                color: var(--ink);
                background: var(--base);
                -webkit-font-smoothing: antialiased;
                font-variant-numeric: tabular-nums;
            }
            .yd2 h1,
            .yd2 h2,
            .yd2 h3,
            .yd2 p,
            .yd2 ul {
                margin: 0;
            }
            .yd2 ul {
                padding: 0;
                list-style: none;
            }
            .i {
                display: block;
                flex-shrink: 0;
            }

            /* type */
            .t-display {
                font-size: 40px;
                line-height: 1.15;
                font-weight: 800;
                letter-spacing: -0.03em;
                text-wrap: balance;
            }
            .t-screen {
                font-size: 28px;
                line-height: 1.2;
                font-weight: 800;
                letter-spacing: -0.02em;
                text-wrap: balance;
            }
            .t-card {
                font-size: 22px;
                line-height: 1.3;
                font-weight: 800;
                letter-spacing: -0.02em;
            }
            .t-row {
                font-size: 19px;
                line-height: 1.5;
                font-weight: 700;
                letter-spacing: -0.01em;
            }
            .t-lead {
                font-size: 18.5px;
                line-height: 1.5;
                color: var(--muted);
            }
            .t-body {
                font-size: 16px;
                line-height: 1.5;
                color: var(--muted);
            }
            .t-small {
                font-size: 14px;
                line-height: 1.5;
                color: var(--muted);
            }
            .t-meta {
                font-size: 12.5px;
                line-height: 1.5;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .t-ink {
                color: var(--ink);
            }
            .t-danger {
                color: var(--danger);
            }

            /* bands and rules */
            .band {
                background: var(--base);
            }
            .band--sand {
                background: var(--sand);
            }
            .rule-b {
                border-bottom: 1.5px solid var(--ink);
            }
            .rule-t {
                border-top: 1.5px solid var(--ink);
            }

            /* header */
            .hdr {
                height: 64px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 24px;
                background: var(--base);
                border-bottom: 1.5px solid var(--ink);
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 19px;
                font-weight: 800;
                letter-spacing: -0.02em;
                color: var(--ink);
                text-decoration: none;
            }
            .brand-tile {
                width: 34px;
                height: 34px;
                display: grid;
                place-items: center;
                background: var(--accent);
                border: 1.5px solid var(--ink);
                border-radius: 10px;
            }

            /* buttons */
            .b {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                min-height: 44px;
                padding: 0 18px;
                border: 1.5px solid var(--ink);
                border-radius: 10px;
                background: var(--card);
                color: var(--ink);
                font: 600 15px/1.5 var(--font-sans);
                white-space: nowrap;
                cursor: pointer;
                box-shadow: var(--shadow-offset);
                transition:
                    transform 0.12s,
                    box-shadow 0.12s;
                text-decoration: none;
                margin-bottom: 4px;
            }
            .b:hover {
                transform: translateY(2px);
                box-shadow: var(--shadow-offset-press);
            }
            .b:focus-visible {
                outline: 2px solid var(--ink);
                outline-offset: 2px;
            }
            .b--primary {
                background: var(--accent);
            }
            .b--danger {
                background: var(--danger);
                color: var(--card);
            }
            .b--danger-ghost {
                color: var(--danger);
            }
            .b--icon {
                width: 44px;
                padding: 0;
            }
            .b--wide {
                width: 100%;
            }
            .b--lg {
                min-height: 52px;
                padding: 0 24px;
                font-size: 16px;
                font-weight: 700;
            }
            .b[disabled],
            .b.is-disabled {
                background: var(--base);
                border-style: dashed;
                border-color: var(--muted);
                color: var(--muted);
                box-shadow: none;
                cursor: not-allowed;
                transform: none;
            }
            .b[aria-pressed='true'].is-ink {
                background: var(--ink);
                color: var(--card);
            }
            .b.is-off {
                background: var(--danger-tint);
                color: var(--danger);
            }
            .b.is-on {
                background: var(--success-tint);
            }
            .link {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                min-height: 44px;
                color: var(--ink);
                font-weight: 600;
                font-size: 15px;
                text-decoration: underline;
                text-decoration-color: var(--accent);
                text-decoration-thickness: 2.5px;
                text-underline-offset: 4px;
                background: none;
                border: 0;
                padding: 0;
                cursor: pointer;
                font-family: var(--font-sans);
            }
            .link:hover {
                text-decoration-thickness: 4px;
            }
            .split {
                display: inline-flex;
                align-items: stretch;
                border-radius: 10px;
                box-shadow: var(--shadow-offset);
                margin-bottom: 4px;
            }
            .split > .b {
                box-shadow: none;
                margin: 0;
            }
            .split > .b:first-child {
                border-top-right-radius: 0;
                border-bottom-right-radius: 0;
            }
            .split > .b:last-child {
                border-left-width: 0;
                border-top-left-radius: 0;
                border-bottom-left-radius: 0;
                padding: 0 10px;
            }
            .split.is-disabled {
                box-shadow: none;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 14px;
            }
            .row--wrap {
                flex-wrap: wrap;
            }
            .spacer {
                flex: 1;
            }

            /* surfaces */
            .card {
                background: var(--card);
                border: 1.5px solid var(--ink);
                border-radius: 16px;
            }
            .card--panel {
                border-radius: 20px;
            }
            .card--lift {
                box-shadow: var(--shadow-panel);
            }
            .pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 28px;
                padding: 0 12px;
                border: 1.5px solid var(--ink);
                border-radius: 9999px;
                font-size: 12px;
                line-height: 1;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                background: var(--card);
                color: var(--ink);
                white-space: nowrap;
            }
            .pill--sand {
                background: var(--sand);
            }
            .pill--on {
                background: var(--success-tint);
            }
            .pill--off {
                background: var(--danger-tint);
                color: var(--danger);
                border-color: var(--danger);
            }
            .pill--rec {
                background: var(--ink);
                color: var(--card);
                border-color: var(--ink);
            }
            .dot {
                width: 9px;
                height: 9px;
                border-radius: 9999px;
                background: var(--rec);
            }

            /* dock */
            .dock {
                display: inline-flex;
                align-items: flex-start;
                gap: 14px;
                padding: 12px 14px 8px;
                background: var(--card);
                border: 1.5px solid var(--ink);
                border-radius: 20px;
            }

            /* progress, skeleton */
            .prog {
                position: relative;
                height: 12px;
                border: 1.5px solid var(--ink);
                border-radius: 9999px;
                background: var(--card);
                overflow: hidden;
            }
            .prog > span {
                position: absolute;
                inset: 0 auto 0 0;
                background: var(--accent);
                border-right: 1.5px solid var(--ink);
            }
            .sk {
                background: var(--rule);
                border-radius: 10px;
                animation: yd2-pulse 1.4s ease-in-out infinite;
            }
            @keyframes yd2-pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.55;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .sk {
                    animation: none;
                }
                .b {
                    transition: none;
                }
            }

            /* video frame */
            .frame {
                border: 1.5px solid var(--ink);
                border-radius: 10px;
                overflow: hidden;
                background: var(--card);
            }
            /* Editor video frame: the webcam bubble's hard shadow, so a dark row along the bottom of a window share merges into a heavy edge */
            .frame--lift {
                box-shadow: 4px 4px 0 var(--ink);
            }

            /* webcam bubble */
            .bubble {
                border-radius: 9999px;
                overflow: hidden;
                border: 2px solid var(--ink);
                box-shadow: 4px 4px 0 var(--ink);
                background: var(--card);
            }
            .slot {
                border-radius: 9999px;
                border: 2px dashed var(--ink);
                background: rgba(253, 251, 247, 0.6);
            }

            /* timeline */
            .tl {
                display: flex;
                gap: 3px;
            }
            .cell {
                position: relative;
                width: 80px;
                height: 64px;
                flex-shrink: 0;
                border-radius: 8px;
                border: 1.5px solid var(--ink);
                overflow: hidden;
                background: var(--card);
            }
            .cell.is-current {
                outline: 3px solid var(--accent);
                outline-offset: 2px;
                z-index: 1;
            }
            .cell.is-cut {
                border-color: var(--danger);
            }
            .cell.is-cut::after {
                content: '';
                position: absolute;
                inset: 0;
                background: var(--danger-tint);
                opacity: 0.72;
            }
            .cell.is-sk {
                border-color: var(--rule);
                background: var(--rule);
            }
            .cutmark {
                position: relative;
                width: 3px;
                flex-shrink: 0;
                background: var(--danger);
                border-radius: 2px;
                margin: 0 4px;
            }
            .cutmark > .b {
                position: absolute;
                left: 50%;
                top: -22px;
                transform: translateX(-50%);
                min-height: 30px;
                height: 30px;
                width: 30px;
                padding: 0;
                border-radius: 9999px;
                box-shadow: var(--shadow-offset-press);
            }
            .ov {
                position: relative;
                height: 32px;
                border: 1.5px solid var(--ink);
                border-radius: 10px;
                background: var(--card);
                overflow: hidden;
            }
            .ov > .win {
                position: absolute;
                top: 0;
                bottom: 0;
                background: var(--accent-tint);
                border-left: 2px solid var(--ink);
                border-right: 2px solid var(--ink);
            }
            .ov > .cut {
                position: absolute;
                top: 0;
                bottom: 0;
                width: 4px !important;
                margin-left: -2px;
                background: var(--danger);
            }
            .ov > .head {
                position: absolute;
                top: -1px;
                bottom: -1px;
                width: 2px;
                background: var(--ink);
            }
            .range {
                -webkit-appearance: none;
                appearance: none;
                height: 12px;
                border: 1.5px solid var(--ink);
                border-radius: 9999px;
                background:
                    linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 15%) 100% no-repeat,
                    var(--card);
            }
            .range::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 22px;
                height: 22px;
                border-radius: 9999px;
                background: var(--card);
                border: 2px solid var(--ink);
                box-shadow: 0 2px 0 var(--ink);
            }

            /* dialog */
            .scrim {
                position: absolute;
                inset: 0;
                background: var(--scrim);
                display: grid;
                place-items: center;
            }
            .dialog {
                width: 480px;
                max-width: calc(100% - 48px);
                padding: 28px;
                display: flex;
                flex-direction: column;
                gap: 18px;
                background: var(--card);
                border: 1.5px solid var(--ink);
                border-radius: 20px;
                box-shadow: var(--shadow-panel);
            }
            .dl {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 6px 18px;
                padding: 14px 16px;
                background: var(--base);
                border: 1.5px solid var(--ink);
                border-radius: 14px;
            }
            .dl dt {
                font-size: 12.5px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .dl dd {
                margin: 0;
                font-size: 15px;
                font-weight: 600;
                color: var(--ink);
                overflow-wrap: anywhere;
            }

            /* notices */
            .notice {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px 10px 16px;
                border: 1.5px solid var(--ink);
                border-radius: 14px;
                background: var(--success-tint);
            }
            .notice--danger {
                background: var(--danger-tint);
            }

            /* tooltip & menu */
            .tip {
                position: relative;
                display: inline-flex;
                padding: 6px 12px;
                border-radius: 10px;
                background: var(--ink);
                color: var(--card);
                font-size: 14px;
                font-weight: 600;
            }
            .menu {
                min-width: 220px;
                padding: 6px;
                background: var(--card);
                border: 1.5px solid var(--ink);
                border-radius: 14px;
                box-shadow: var(--shadow-offset);
            }
            .menu li {
                display: flex;
                align-items: center;
                gap: 10px;
                min-height: 44px;
                padding: 0 12px;
                border-radius: 10px;
                font-size: 15px;
            }
            .menu li.is-sel {
                background: var(--accent-tint);
                font-weight: 600;
            }

            /* status list */
            .status {
                border: 1.5px solid var(--ink);
                border-radius: 16px;
                background: var(--card);
                overflow: hidden;
            }
            .status li {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 14px 18px;
            }
            .status li + li {
                border-top: 1px solid var(--hairline);
            }

            /* floating control window */
            .pip {
                width: 340px;
                border: 1.5px solid var(--ink);
                border-radius: 14px;
                overflow: hidden;
                background: var(--card);
                box-shadow: var(--shadow-panel);
            }
            .pip-bar {
                height: 30px;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 12px;
                background: var(--sand);
                border-bottom: 1.5px solid var(--ink);
                font-size: 12.5px;
                font-weight: 700;
            }
            .pip-body {
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }
        </style>
    </head>
